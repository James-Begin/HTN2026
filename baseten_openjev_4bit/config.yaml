# yaml-language-server: $schema=https://raw.githubusercontent.com/basetenlabs/truss/main/truss/config.schema.json
model_name: sequitor-openjev-4bit-reranker
python_version: py311
requirements:
  - transformers==5.17.0
  - peft>=0.14.0
  - bitsandbytes>=0.45.0
  - sentencepiece==0.2.1
  - accelerate>=1.3.0
resources:
  accelerator: L4
  cpu: "4"
  memory: 16Gi
  use_gpu: true
weights:
  - source: hf://AlexWortega/openjev@4b5f9a67fa2ebe77466bce0656ce350effc3148c
    mount_location: /models/openjev
    allow_patterns:
      - qwen3.5-4b-nli-v2/**
environment_variables:
  TOKENIZERS_PARALLELISM: "false"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
